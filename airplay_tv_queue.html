<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>AirPlay TV Queue</title><style>
:root{color-scheme:dark;--bg:#090e1b;--panel:#141c2d;--panel2:#1b2740;--blue:#438cff;--muted:#9eacc5;--line:#2a3851}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#101a31,#080c16 55%);color:#f6f8ff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}header{padding:calc(env(safe-area-inset-top) + 18px) 18px 16px;position:sticky;top:0;background:#0b1020ed;backdrop-filter:blur(18px);z-index:5;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.logo{background:var(--blue);border-radius:15px;width:48px;height:48px;display:grid;place-items:center;font-size:25px}.sub{color:var(--muted);font-size:13px;margin-top:3px}.status{margin-left:auto;border-radius:99px;background:#163c36;color:#76f0c4;font-size:11px;padding:7px 10px}nav{display:flex;gap:6px;margin-top:17px}nav button{flex:1;background:transparent;color:var(--muted);padding:10px 4px;font-size:12px}nav button.active{background:#243b60;color:white}main{padding:18px;max-width:680px;margin:auto;padding-bottom:100px}h1{font-size:25px;margin:5px 0 6px}h2{font-size:18px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.panel{background:linear-gradient(145deg,#19243a,#111827);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.btn,button{border:0;border-radius:12px;background:var(--blue);color:white;padding:12px 14px;font-weight:650;font-size:14px;cursor:pointer}.btn.secondary,button.secondary{background:#243047;color:#e5edff;border:1px solid #35435b}.btn.ghost,button.ghost{background:transparent;border:1px solid var(--line);color:#d9e5fb}.btn.danger{background:#4b2632;color:#ffc9d4}.full{width:100%}input,select{width:100%;background:#0d1423;border:1px solid #34435d;border-radius:12px;color:white;padding:13px;font-size:15px;margin:5px 0 10px}label{display:block;color:#c4d0e4;font-size:12px;margin-top:9px}.servicechips{display:flex;gap:7px;overflow:auto;padding:3px 0 12px}.chip{white-space:nowrap;padding:9px 12px;border-radius:99px;background:#18243a;border:1px solid var(--line);color:#d5e1f8;font-size:12px}.chip.active{background:#28549a;border-color:#438cff}.item{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #27334a}.item:last-child{border-bottom:0}.poster{width:54px;height:68px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#354e78,#171f33);font-size:24px}.itemtitle{font-weight:650;font-size:14px;line-height:1.3}.meta{font-size:12px;color:var(--muted);margin-top:5px}.smallbtn{padding:9px 11px;border-radius:10px}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}.toggle{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 0}.toggle input{width:22px;height:22px;accent-color:var(--blue);margin:0}.now{background:radial-gradient(ellipse at top,#233c65,#101625 70%);text-align:center;padding:26px 18px}.bigicon{font-size:54px;margin:8px}.progress{height:5px;background:#39455c;border-radius:9px;overflow:hidden;margin:18px 0}.progress span{display:block;width:0;height:100%;background:#55a0ff}.toast{font-size:12px;color:#82edc6;min-height:18px;margin-top:8px}.foot{color:#8190a9;font-size:11px;line-height:1.5;text-align:center;margin:24px 8px}a{color:#91bdff}button:active{transform:scale(.98)}@media(min-width:550px){main{padding-top:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
</style></head><body><header><div class="brand"><div class="logo">⌁</div><div><strong style="font-size:18px">AirPlay TV Queue</strong><div class="sub">Your watchlist. Your TV. Your order.</div></div><div class="status" id="status">READY</div></div><nav><button class="active" data-tab="browse">Browse</button><button data-tab="queue">My Queue <span id="count">0</span></button><button data-tab="player">Player</button><button data-tab="settings">Settings</button></nav></header><main id="app"></main><script>
const catalog=[
 {id:'devil',title:'The Devil Wears Prada',type:'Movie',service:'Disney+',length:'1h 49m',emoji:'👠'},
 {id:'princess',title:'The Princess Diaries',type:'Movie',service:'Disney+',length:'1h 55m',emoji:'👑'},
 {id:'desperate',title:'Desperate Housewives',type:'Episode · S1 E1',service:'Hulu',length:'43m',emoji:'🏡'},
 {id:'gossip',title:'Gossip Girl',type:'Episode · S1 E1',service:'Max',length:'42m',emoji:'💋'},
 {id:'twilight',title:'Twilight',type:'Movie',service:'Prime Video',length:'2h 2m',emoji:'🌙'},
 {id:'thirteen',title:'13 Going on 30',type:'Movie',service:'Netflix',length:'1h 38m',emoji:'💖'},
 {id:'oc',title:'The O.C.',type:'Episode · S1 E1',service:'Hulu',length:'44m',emoji:'🌴'},
 {id:'mean',title:'Mean Girls',type:'Movie',service:'Paramount+',length:'1h 37m',emoji:'🎀'}
];let queue=JSON.parse(localStorage.getItem('atq-queue')||'[]');let tab='browse',filter='All',search='',current=0,playing=false,auto=true,toast='';const app=document.getElementById('app');function save(){localStorage.setItem('atq-queue',JSON.stringify(queue));document.getElementById('count').textContent=queue.length}function msg(t){toast=t;render();setTimeout(()=>{toast='';const el=document.querySelector('.toast');if(el)el.textContent=''},2200)}function itemRow(x,idx,mode){return `<div class="item"><div class="poster">${x.emoji||'🎬'}</div><div class="grow"><div class="itemtitle">${esc(x.title)}</div><div class="meta">${esc(x.type)} · ${esc(x.service||'My Library')} · ${esc(x.length||'Length varies')}</div></div>${mode==='browse'?`<button class="smallbtn secondary" onclick="add('${x.id}')">${queue.some(q=>q.id===x.id)?'✓':'＋'}</button>`:`<div style="display:flex;flex-direction:column;gap:5px"><button class="smallbtn secondary" onclick="move(${idx},-1)" ${idx===0?'disabled':''}>↑</button><button class="smallbtn secondary" onclick="move(${idx},1)" ${idx===queue.length-1?'disabled':''}>↓</button><button class="smallbtn danger" onclick="removeItem(${idx})">×</button></div>`}</div>`}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function add(id){if(queue.some(x=>x.id===id)){msg('Already in your queue');return}let x=catalog.find(x=>x.id===id);queue.push({...x});save();msg(x.title+' added')}function removeItem(i){queue.splice(i,1);if(current>=queue.length)current=Math.max(0,queue.length-1);save();render()}function move(i,d){let j=i+d;if(j<0||j>=queue.length)return;[queue[i],queue[j]]=[queue[j],queue[i]];save();render()}function play(){if(!queue.length){msg('Add a title first');return}playing=true;tab='player';render();}function next(){if(!queue.length)return;if(current<queue.length-1)current++;else if(auto)current=0;else{playing=false}render()}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('status').textContent=playing?'SESSION':'READY';document.getElementById('count').textContent=queue.length;
if(tab==='browse'){let items=catalog.filter(x=>(filter==='All'||x.service===filter)&&(x.title.toLowerCase().includes(search.toLowerCase())));app.innerHTML=`<h1>Discover & add</h1><div class="muted">Build one watchlist from your favorite services.</div><div class="panel"><input id="search" placeholder="Search movies and shows" value="${esc(search)}" oninput="search=this.value;renderKeepSearch()"><div class="servicechips">${['All','Netflix','Disney+','Hulu','Max','Prime Video','Paramount+'].map(s=>`<button class="chip ${filter===s?'active':''}" onclick="filter='${s}';render()">${s}</button>`).join('')}</div>${items.map(x=>itemRow(x,0,'browse')).join('')||'<p class="muted">No matches. Try another service or search.</p>'}</div><button class="full" onclick="tab='queue';render()">Review queue (${queue.length}) →</button><div class="toast">${esc(toast)}</div>`;
}else if(tab==='queue'){app.innerHTML=`<h1>My TV Queue</h1><div class="muted">${queue.length} titles · Drag-free ordering with arrows</div><div class="panel">${queue.map((x,i)=>itemRow(x,i,'queue')).join('')||'<p class="muted">Your queue is empty. Browse and add a title to begin.</p>'}</div><div class="grid"><button class="secondary full" onclick="tab='browse';render()">＋ Add titles</button><button class="full" onclick="play()">▶ Play queue</button></div><button class="ghost full" style="margin-top:10px" onclick="if(confirm('Clear your whole queue?')){queue=[];save();render()}">Clear queue</button><div class="toast">${esc(toast)}</div>`;
}else if(tab==='player'){let x=queue[current];app.innerHTML=`<h1>Now Playing</h1><div class="muted">Playback controls and AirPlay handoff</div><div class="panel now"><div class="bigicon">${x?x.emoji:'📺'}</div><h2>${x?esc(x.title):'Nothing queued yet'}</h2><div class="muted">${x?esc(x.service)+' · '+esc(x.type):'Add titles to your queue to begin'}</div><div class="progress"><span style="width:${playing?'35%':'0%'}"></span></div><div class="row" style="justify-content:center"><button class="secondary" onclick="playing=false;render()">Ⅱ Pause</button><button onclick="if(!queue.length){tab='browse';render()}else{playing=true;render()}">▶ Play</button><button class="secondary" onclick="next()">Next ↗</button></div></div><div class="panel"><h2>Send supported media to TV</h2><div class="muted">On iPhone, use Control Center → Screen Mirroring for compatible AirPlay devices, or the AirPlay button inside a supported media player. This web app cannot summon Apple's native route picker or take over another app's stream.</div><button class="full" style="margin-top:13px" onclick="alert('Open iPhone Control Center, tap Screen Mirroring, then select your AirPlay-compatible TV. For protected streaming apps, start playback in that service and use its own AirPlay controls if available.')">How to connect to AirPlay</button></div><div class="toast">${esc(toast)}</div>`;
}else{app.innerHTML=`<h1>Settings</h1><div class="muted">Your local queue preferences</div><div class="panel"><div class="toggle"><div><strong>Automatic next title (demo)</strong><div class="muted">Advances within this queue simulation only.</div></div><input type="checkbox" ${auto?'checked':''} onchange="auto=this.checked"></div><div class="toggle"><div><strong>Save queue on this iPhone</strong><div class="muted">Uses Safari's local storage on this device.</div></div><span>✓</span></div><div class="toggle"><div><strong>Background playback</strong><div class="muted">A web page cannot guarantee playback after Safari is closed or the phone is locked.</div></div><span>Info</span></div></div><div class="panel"><h2>What's real today?</h2><p class="muted">This prototype can save and organize a queue. It does not stream catalog titles or control Netflix, Disney+, Hulu, or other apps. Real cross-service automatic playback needs service-authorized integrations or a compatible playback receiver.</p></div><button class="ghost full" onclick="if(confirm('Erase saved queue from this iPhone?')){queue=[];save();render()}">Erase saved queue</button>`}
app.querySelectorAll('button').forEach(b=>{if(b.textContent.trim()===''){b.setAttribute('aria-label','Action')}})}function renderKeepSearch(){let el=document.getElementById('search');let pos=el?el.selectionStart:0;render();let next=document.getElementById('search');if(next){next.focus();next.setSelectionRange(pos,pos)}}document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));render();
</script></body></html>
